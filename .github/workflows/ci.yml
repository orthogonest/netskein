---
name: Swift CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.swift"
      - "Makefile"
      - "Package.swift"
      - "Package.resolved"
      - ".swift-format"
      - ".pre-commit-config.yaml"

jobs:
  lint-format:
    name: Lint + Format
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Host Swift Version
        run: swift --version

      - name: Run Strict Swift Format Pipeline
        uses: pre-commit/action@v3.0.1

  build-test:
    name: Build + Tests + Coverage
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Host Swift Version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Resolve Dependencies
        run: |
          swift package clean
          swift package resolve

      - name: Run Tests
        run: |
          swift test \
          --parallel \
          --enable-swift-testing \
          --enable-code-coverage

      - name: Convert Coverage to LCOV
        uses: step-security/swift-coverage-action@v6
        id: coverage-files
        with:
          format: "lcov"

      - name: Check Minimum Coverage Threshold
        uses: tluijken/code-coverage-threshold@v1
        with:
          coverage-file: ".swiftcov/lcov.info"
          minimum-coverage: 90

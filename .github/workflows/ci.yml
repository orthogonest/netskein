---
name: Swift CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.swift"
      - "Makefile"
      - "Package.swift"
      - "Package.resolved"

jobs:
  build-test:
    name: Build + Tests (Swift ${{ matrix.swift }})

    runs-on: macos-latest

    strategy:
      matrix:
        include:
          - swift: "6.1"
            xcode: "16.1"
          - swift: "6.2"
            xcode: "16.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hard Select Xcode and Toolchain
        run: |
          sudo xcode-select -s \
            /Applications/${{ matrix.xcode }}/Contents/Developer
          echo "CURRENT SWIFT VERSION:"
          swift --version
          echo "CURRENT DEVELOPER DIR:"
          xcode-select -p

      - name: Select Swift Version
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: >-
            ${{ runner.os }}-swiftpm-${{ matrix.swift }}-${{
            hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-${{ matrix.swift }}-

      - name: Resolve Dependencies
        run: |
          swift package clean
          swift package resolve

      - name: Build
        run: swift build --build-tests

      - name: Run Tests
        run: swift test --parallel --enable-swift-testing

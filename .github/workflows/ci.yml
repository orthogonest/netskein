---
name: Swift CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.swift"
      - "Makefile"
      - "Package.swift"
      - "Package.resolved"
      - ".swift-format"
      - ".pre-commit-config.yaml"

jobs:
  lint-format:
    name: Lint + Format
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Host Swift Version
        run: swift --version

      - name: Run Strict Swift Format Pipeline
        uses: pre-commit/action@v3.0.1

  build-test:
    name: Build + Tests + Coverage
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Host Swift Version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Resolve Dependencies
        run: |
          swift package clean
          swift package resolve

      - name: Build
        run: swift build --build-tests

      - name: Run Tests
        run: |
          swift test \
          --parallel \
          --enable-swift-testing \
          --enable-code-coverage \
          --build-path .build

      - name: Generate HTML Report (Optional for artifacts)
        run: |
          mkdir -p coverage-report
          xcrun llvm-cov show \
            .build/out/Products/Debug/NetSkeinTests.xctest/\
            Contents/MacOS/NetSkeinTests \
            -instr-profile=.build/out/Products/Debug/codecov/default.profdata \
            -format=html -output-dir=coverage-report \
            Sources

      - name: Check Minimum Coverage Threshold
        env:
          MIN_COVERAGE_THRESHOLD: 90
        run: ./Scripts/check-coverage.sh

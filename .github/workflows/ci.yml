---
name: Swift CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.swift"
      - "Makefile"
      - "Package.swift"
      - "Package.resolved"

jobs:
  build-test:
    name: Build + Tests (Swift ${{ matrix.swift }})

    runs-on: macos-latest

    strategy:
      matrix:
        include:
          - swift: "6.1"
            path: "/Applications/Xcode_16.1.app/Contents/Developer"
          - swift: "6.2"
            path: "/Applications/Xcode_16.2.app/Contents/Developer"

    env:
      DEVELOPER_DIR: ${{ matrix.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Environment Toolchain
        run: |
          echo "ACTIVE DEVELOPER PATH:"
          xcode-select -p
          echo "ACTIVE SWIFT VERSION:"
          swift --version

      - name: Select Swift Version
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: >-
            ${{ runner.os }}-swiftpm-${{ matrix.swift }}-${{
            hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-${{ matrix.swift }}-

      - name: Resolve Dependencies
        run: |
          swift package clean
          swift package resolve

      - name: Build
        run: swift build --build-tests

      - name: Run Tests
        run: swift test --parallel --enable-swift-testing

---
name: CI

# Checks main after each merge and gives the README's CI badge a status.
# The badge shows this workflow's name, so keep it short.
#
# Pull requests already run the full pipeline in pull-request.yml, so
# this only runs the macOS build, tests and coverage, and only when
# Swift-related files changed. Keep the job in sync with the macOS job
# in pull-request.yml.
#
# Run it by hand from the Actions tab to retry a flaky failure, or to
# give the badge its first status.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - "Makefile"
      - "Package.swift"
      - "Package.resolved"
      - ".swift-format"
      - "Scripts/check-coverage.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-test:
    name: macOS Build + Tests + Coverage
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Host Swift Version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftpm
            .build
          key: >
            ${{ runner.os }}-swiftpm-${{
            hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Run Tests
        run: |
          swift test \
            --parallel \
            --enable-swift-testing \
            --enable-code-coverage

      - name: Check Minimum Coverage Threshold
        env:
          MIN_COVERAGE_THRESHOLD: 90
        run: |
          chmod +x ./Scripts/check-coverage.sh
          ./Scripts/check-coverage.sh

---
repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format (auto-format)
        entry: swift format --in-place --configuration .swift-format
        language: system
        types: [swift]

      - id: swift-lint
        name: swift-lint (strict validation)
        entry: swift format lint --strict --configuration .swift-format
        language: system
        types: [swift]
